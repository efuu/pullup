<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="none" stroke="#111" stroke-width="1.5">
  <text x="20" y="24" fill="#111" stroke="none" font-size="15" font-weight="bold">Sketch 1 — Create a plan</text>
  <rect x="20" y="40" width="300" height="580" rx="18"/>
  <text x="40" y="76" fill="#111" stroke="none" font-size="16" font-weight="bold">New plan</text>
  <text x="40" y="112" fill="#111" stroke="none">What</text>
  <rect x="40" y="120" width="260" height="32" rx="4"/>
  <text x="48" y="141" fill="#777" stroke="none">KBBQ</text>
  <text x="40" y="180" fill="#111" stroke="none">Where</text>
  <rect x="40" y="188" width="260" height="32" rx="4"/>
  <text x="48" y="209" fill="#777" stroke="none">Koreana, Central Sq</text>
  <text x="40" y="248" fill="#111" stroke="none">When</text>
  <rect x="40" y="256" width="150" height="32" rx="4"/>
  <text x="48" y="277" fill="#777" stroke="none">Sat Oct 17</text>
  <rect x="200" y="256" width="100" height="32" rx="4"/>
  <text x="208" y="277" fill="#777" stroke="none">6:00 pm</text>
  <text x="40" y="316" fill="#111" stroke="none">Maybes must decide by</text>
  <rect x="40" y="324" width="100" height="32" rx="4"/>
  <text x="48" y="345" fill="#777" stroke="none">2:00 pm</text>
  <text x="150" y="345" fill="#555" stroke="none" font-size="11">(default: 4 hrs before)</text>
  <rect x="40" y="400" width="260" height="40" rx="6" fill="#111"/>
  <text x="170" y="425" fill="#fff" stroke="none" text-anchor="middle" font-weight="bold">Create plan + copy link</text>
  <rect x="40" y="470" width="260" height="60" rx="6" stroke-dasharray="4 3"/>
  <text x="48" y="492" fill="#111" stroke="none" font-size="12">pullup.app/p/koreana-sat</text>
  <text x="48" y="512" fill="#555" stroke="none" font-size="11">appears after create; paste it into the group chat</text>
  <line x1="340" y1="140" x2="305" y2="140" stroke-dasharray="3 3"/>
  <text x="346" y="136" fill="#111" stroke="none" font-size="12">only three things to fill in;</text>
  <text x="346" y="152" fill="#111" stroke="none" font-size="12">no accounts for invitees, no</text>
  <text x="346" y="168" fill="#111" stroke="none" font-size="12">contact list, no app install</text>
  <line x1="340" y1="340" x2="305" y2="340" stroke-dasharray="3 3"/>
  <text x="346" y="336" fill="#111" stroke="none" font-size="12">decision deadline: the one</text>
  <text x="346" y="352" fill="#111" stroke="none" font-size="12">setting that kills "maybe"</text>
  <text x="346" y="368" fill="#111" stroke="none" font-size="12">limbo (see sketch 2)</text>
  <line x1="340" y1="500" x2="305" y2="500" stroke-dasharray="3 3"/>
  <text x="346" y="496" fill="#111" stroke="none" font-size="12">the link IS the invite;</text>
  <text x="346" y="512" fill="#111" stroke="none" font-size="12">anyone with it can RSVP</text>
</svg>
